# Docker-first: CI runs the same compose test command as local, then publishes the prod image.
stages: [test, publish]

default:
  image: docker:29
  services: [docker:29-dind]

variables:
  DOCKER_TLS_CERTDIR: /certs

test:
  stage: test
  script:
    - docker compose --profile test run --rm --build test

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --target prod -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE"
