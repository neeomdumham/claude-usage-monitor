default:
  image: node:24-alpine
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]

variables:
  npm_config_store_dir: .pnpm-store

check:
  services:
    - name: postgres:17-alpine
      alias: db
  variables:
    POSTGRES_USER: monitor
    POSTGRES_PASSWORD: monitor
    POSTGRES_DB: monitor
    TEST_DATABASE_URL: postgres://monitor:monitor@db:5432/monitor
  script:
    - pnpm typecheck
    - pnpm test
    - pnpm build
