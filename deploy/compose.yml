# Production stack for one small server: Postgres, the app and Caddy (HTTPS). Values come from .env next to this
# file (see deploy/env.example). Start: docker compose up -d. Update: docker compose pull app && docker compose up -d
services:
  db:
    image: postgres:17-alpine
    # Sized for a 512 MB host with a handful of devices.
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20]
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: monitor
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, monitor]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD}@db:5432/monitor
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SECURE_COOKIES: "true"
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_GROUP: ${GITLAB_GROUP:-}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy:
