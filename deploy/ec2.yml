AWSTemplateFormatVersion: '2010-09-09'
Description: claude-usage-monitor on one small Graviton instance (Docker Compose, Caddy HTTPS, daily EBS snapshots, GitHub OIDC SSM deploy role)

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

# Create/update: aws cloudformation deploy --profile velacrew-dev --region ap-southeast-1 --stack-name usage-monitor --template-file deploy/ec2.yml --capabilities CAPABILITY_IAM
# No SSH: open a shell with `aws ssm start-session --target <InstanceId>`.
# Releases deploy automatically via .github/workflows/release.yml (OIDC -> SSM) or locally via scripts/release.sh.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.nano
    AllowedValues: [t4g.nano, t4g.micro, t4g.small]
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  GitHubRepo:
    Type: String
    Default: neeomdumham/claude-usage-monitor
    Description: GitHub owner/repo permitted to assume GitHubDeployRole over OIDC
  GitHubOidcSubPrefix:
    Type: String
    Default: repo:neeomdumham@48099655/claude-usage-monitor@1472775988
    Description: Immutable OIDC sub claim prefix from GitHub (GET /repos/<owner>/<repo>/actions/oidc/customization/sub)
  GitHubEnvironment:
    Type: String
    Default: Production
    Description: GitHub Actions environment name required to assume GitHubDeployRole
  CreateGitHubOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true only if this AWS account does not already have the token.actions.githubusercontent.com OIDC provider

Conditions:
  ShouldCreateGitHubOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: usage-monitor HTTP and HTTPS only - shell access is via Session Manager
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: ACME challenge and redirect }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Dashboard and device API }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 10, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: volume
            Tags: [{ Key: Backup, Value: usage-monitor }]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      # Standard credits: a CPU spike throttles instead of billing surplus credits.
      CreditSpecification: { CPUCredits: standard }
      Tags: [{ Key: Name, Value: usage-monitor }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          # 1 GB swap: Postgres + Node + Caddy on 512 MB needs the headroom.
          fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap defaults 0 0' >> /etc/fstab
          dnf install -y docker
          mkdir -p /usr/local/lib/docker/cli-plugins && cd /usr/local/lib/docker/cli-plugins
          base=https://github.com/docker/compose/releases/download/v5.6.1/docker-compose-linux-aarch64
          curl -fsSL "$base" -o docker-compose-linux-aarch64 && curl -fsSL "$base.sha256" -o compose.sha256
          sha256sum -c compose.sha256 && mv docker-compose-linux-aarch64 docker-compose && chmod +x docker-compose && rm compose.sha256
          systemctl enable --now docker
          # scripts/release.sh fetches compose.yml, Caddyfile and box.sh at each release; .env is written by hand.
          mkdir -p /opt/monitor && cd /opt/monitor
          curl -fsSLO https://raw.githubusercontent.com/neeomdumham/claude-usage-monitor/main/deploy/env.example

  PublicIp:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance

  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: dlm.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole]

  DailySnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: usage-monitor daily volume snapshots kept 7 days
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{ Key: Backup, Value: usage-monitor }]
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ['20:00'] } # 02:00 in Dhaka
            RetainRule: { Count: 7 }
            CopyTags: true

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubOidcProvider
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows fresh AWS accounts to authenticate GitHub Actions workflows without static IAM keys.
        must: Keep conditional (default false) because IAM allows only one OIDC provider per URL per AWS account.
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Least-privilege OIDC role assumed by .github/workflows/release.yml to deploy this stack's EC2 box via SSM.
        must: Restrict trust policy to the configured GitHubRepo + GitHubEnvironment and scope ssm:SendCommand to this stack's EC2 InstanceId only; omit RoleName so CAPABILITY_IAM suffices.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub ${GitHubOidcSubPrefix}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: usage-monitor-ssm-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DescribeThisStack
                Effect: Allow
                Action: [cloudformation:DescribeStacks]
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Sid: SendCommandToThisInstance
                Effect: Allow
                Action: [ssm:SendCommand]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
              - Sid: RunShellScriptDocument
                Effect: Allow
                Action: [ssm:SendCommand]
                Resource: !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: ReadCommandStatus
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

Outputs:
  PublicIp:
    Description: Point your DNS A record here
    Value: !Ref PublicIp
  InstanceId:
    Value: !Ref Instance
  Shell:
    Value: !Sub aws ssm start-session --target ${Instance}
  GitHubDeployRoleArn:
    Description: Set as AWS_DEPLOY_ROLE_ARN secret/variable in the Production GitHub Environment
    Value: !GetAtt GitHubDeployRole.Arn
